<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DPÜ Rotalama Sistemi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div id="kontrol-paneli">
        <button type="button" id="panel-tutamac" aria-label="Paneli aç veya kapat" aria-expanded="true"></button>
        <header>
            <h3>📍 DPÜ Kampüs Rotalama</h3>
            <p>Evliya Çelebi Yerleşkesi · Yaya yol tarifi</p>
        </header>

        <div id="kategoriler" role="group" aria-label="Yer türüne göre süz"></div>
        <button type="button" id="en-yakin" hidden></button>

        <div class="girdi-grubu arama-kutusu">
            <label>Nereden:</label>
            <input type="text" id="baslangic-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="baslangic-liste" class="acilir-liste"></div>
        </div>
        
        <div class="girdi-grubu arama-kutusu">
            <label>Nereye:</label>
            <input type="text" id="bitis-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="bitis-liste" class="acilir-liste"></div>
        </div>
        
        <div id="eylemler">
            <button type="button" id="yer-degistir" class="ikincil" title="Başlangıç ve bitişi değiştir" aria-label="Başlangıç ve bitişi değiştir">⇅</button>
            <button type="button" onclick="rotaCiz()">Rotayı Bul</button>
            <button type="button" id="temizle" class="ikincil" title="Temizle" aria-label="Temizle">✕</button>
        </div>
        <div id="nokta-eylemleri">
            <button type="button" id="nokta-isaretle">📌 Nokta işaretle</button>
            <button type="button" id="buradayim">🙋 Buradayım</button>
        </div>
        <p id="durum">Hedeflerinizi arayın veya seçin</p>
        <button type="button" id="paylas" hidden>🔗 Rotayı paylaş</button>
        <p id="gps-uyari"></p>
    </div>

    <div id="yer-karti" aria-live="polite"></div>

    <div id="harita"></div>

    <dialog id="paylas-penceresi" aria-labelledby="paylas-baslik">
        <h4 id="paylas-baslik">Rotayı paylaş</h4>
        <p id="paylas-rota"></p>
        <canvas id="paylas-qr" aria-label="Rota için QR kod"></canvas>
        <label class="secenek">
            <input type="checkbox" id="paylas-konumdan">
            Başlangıç, linki açanın konumu olsun
        </label>
        <input type="text" id="paylas-link" readonly aria-label="Rota linki">
        <p id="paylas-bilgi" aria-live="polite"></p>
        <button type="button" id="paylas-kopyala">Linki kopyala</button>
        <button type="button" id="paylas-menu" hidden>Gönder (WhatsApp vb.)</button>
        <button type="button" id="paylas-indir">QR'ı indir</button>
        <button type="button" id="paylas-kapat">Kapat</button>
    </dialog>

    <dialog id="nokta-penceresi" aria-labelledby="nokta-baslik">
        <form id="nokta-formu" novalidate>
            <h4 id="nokta-baslik">Noktayı işaretle</h4>
            <p id="nokta-uyari"></p>
            <label>Ad
                <input type="text" name="ad" maxlength="60" placeholder="Örn. Fotoğraf Kulübü tanışma" autocomplete="off">
            </label>
            <div id="nokta-zaman">
                <label>Tarih (isteğe bağlı)
                    <input type="date" name="tarih">
                </label>
                <div class="saatler">
                    <label>Başlangıç
                        <input type="time" name="saat">
                    </label>
                    <label>Bitiş
                        <input type="time" name="bitis">
                    </label>
                </div>
            </div>
            <p id="nokta-hata" role="alert"></p>
            <button type="submit">Link ve QR oluştur</button>
            <button type="button" id="nokta-vazgec">Vazgeç</button>
        </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='paylas.js') }}"></script>
    <script src="{{ url_for('static', filename='nokta.js') }}"></script>
</body>
</html>
