<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DPÜ Rotalama Sistemi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div id="kontrol-paneli">
        <button type="button" id="panel-tutamac" aria-label="Paneli aç veya kapat" aria-expanded="true"></button>
        <header>
            <h3>📍 DPÜ Kampüs Rotalama</h3>
            <p>Evliya Çelebi Yerleşkesi · Yaya yol tarifi</p>
        </header>

        <div id="kategoriler" role="group" aria-label="Yer türüne göre süz"></div>
        <button type="button" id="en-yakin" hidden></button>

        <div class="girdi-grubu arama-kutusu">
            <label>Nereden:</label>
            <input type="text" id="baslangic-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="baslangic-liste" class="acilir-liste"></div>
        </div>
        
        <div class="girdi-grubu arama-kutusu">
            <label>Nereye:</label>
            <input type="text" id="bitis-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="bitis-liste" class="acilir-liste"></div>
        </div>
        
        <div id="eylemler">
            <button type="button" id="yer-degistir" class="ikincil" title="Başlangıç ve bitişi değiştir" aria-label="Başlangıç ve bitişi değiştir">⇅</button>
            <button type="button" onclick="rotaCiz()">Rotayı Bul</button>
            <button type="button" id="temizle" class="ikincil" title="Temizle" aria-label="Temizle">✕</button>
        </div>
        <p id="durum">Hedeflerinizi arayın veya seçin</p>
        <p id="gps-uyari"></p>
    </div>

    <div id="yer-karti" aria-live="polite"></div>

    <div id="harita"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
