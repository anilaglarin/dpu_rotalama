<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DPÜ Rotalama Sistemi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div id="kontrol-paneli">
        <h3>📍 DPÜ Kampüs Rotalama</h3>

        <div class="girdi-grubu arama-kutusu">
            <label>Nereden:</label>
            <input type="text" id="baslangic-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="baslangic-liste" class="acilir-liste"></div>
        </div>
        
        <div class="girdi-grubu arama-kutusu">
            <label>Nereye:</label>
            <input type="text" id="bitis-secim" placeholder="Bina adı yazın veya seçin..." autocomplete="off">
            <div id="bitis-liste" class="acilir-liste"></div>
        </div>
        
        <button onclick="rotaCiz()">Rotayı Bul</button>
        <p id="durum">Hedeflerinizi arayın veya seçin</p>
    </div>

    <div id="harita"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
